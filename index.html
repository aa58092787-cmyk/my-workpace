<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>모아 — 나만의 칸반보드</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body><div class="app">
<header><div class="brand"><span class="logo" aria-hidden="true">▥</span>모아<span style="font-size:12px;font-weight:450;color:var(--muted);letter-spacing:0;margin-left:10px">나만의 작업 공간</span></div><span class="badge">● Supabase 워크스페이스</span></header>
<main><section class="auth-panel" aria-label="계정"><form id="authForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><div class="actions"><button class="primary" type="submit">로그인</button><button class="quiet" id="signup" type="button">회원가입</button></div></form><div id="account" class="hidden"><span id="accountEmail"></span> <button id="logout" class="quiet">로그아웃</button> <button id="refresh" class="quiet">새로고침</button></div><p id="authMessage" role="status">카드는 계정별로 분리됩니다. 로그인 정보는 브라우저 저장소에 보관하지 않아 새로고침하면 다시 로그인해야 합니다.</p></section><section class="hero"><div><div class="eyebrow">MY PERSONAL BOARD</div><h1>작은 할 일, 차근차근.</h1><p>머릿속의 계획을 꺼내어, 오늘의 진도를 만들어 보세요.</p></div><button class="primary" id="newTask">＋ 할 일 추가</button></section>
<section class="stats" aria-label="작업 현황"><div class="stat"><div><label>전체 할 일</label><strong id="total">0</strong></div><span class="stat-icon">▤</span></div><div class="stat"><div><label>진행 중</label><strong id="active">0</strong></div><span class="stat-icon">◷</span></div><div class="stat"><div><label>완료율</label><strong id="rate">0%</strong></div><span class="stat-icon">✓</span></div></section>
<section class="toolbar" aria-label="검색 및 백업"><div class="filters"><input class="search" id="search" type="search" placeholder="할 일 검색…" aria-label="제목과 설명 검색"><select id="priorityFilter" aria-label="우선순위 필터"><option value="all">모든 우선순위</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option></select></div><div class="tools"><span id="resultCount" style="font-size:11px;color:var(--muted)"></span><button class="quiet" id="export">↓ 백업 저장</button><button class="quiet" id="import">↑ 불러오기</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></section>
<section class="board" aria-label="칸반보드">
<section class="column todo" data-status="todo"><div class="col-head"><div class="col-label"><span class="dot"></span>할 일 <span class="count" id="count-todo">0</span></div><button class="add-small" data-add="todo" aria-label="할 일에 추가">＋</button></div><div class="cards" id="cards-todo"></div><button class="add-row" data-add="todo">＋ 새 할 일 추가</button></section>
<section class="column doing" data-status="doing"><div class="col-head"><div class="col-label"><span class="dot"></span>진행 중 <span class="count" id="count-doing">0</span></div><button class="add-small" data-add="doing" aria-label="진행 중에 추가">＋</button></div><div class="cards" id="cards-doing"></div><button class="add-row" data-add="doing">＋ 새 할 일 추가</button></section>
<section class="column done" data-status="done"><div class="col-head"><div class="col-label"><span class="dot"></span>완료 <span class="count" id="count-done">0</span></div><button class="add-small" data-add="done" aria-label="완료에 추가">＋</button></div><div class="cards" id="cards-done"></div><button class="add-row" data-add="done">＋ 새 할 일 추가</button></section>
</section></main><footer class="footer"><span id="saveState">로그인 후 Supabase에 저장됩니다.</span><span>카드를 드래그하거나 상태 메뉴로 이동하세요.</span></footer></div>
<dialog id="taskDialog" aria-labelledby="dialogTitle"><form id="taskForm"><h2 id="dialogTitle">새 할 일</h2><div class="field"><label for="title">제목 *</label><input id="title" maxlength="150" required placeholder="어떤 일을 할까요?"></div><div class="field"><label for="description">설명</label><textarea id="description" maxlength="5000" placeholder="기억해야 할 내용을 적어 보세요."></textarea></div><div class="form-grid"><div class="field"><label for="status">상태</label><select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></div><div class="field"><label for="priority">우선순위</label><select id="priority"><option value="low">낮음</option><option value="medium" selected>보통</option><option value="high">높음</option></select></div></div><div class="field"><label for="due">마감일 (선택)</label><input id="due" type="date" min="0001-01-01" max="9999-12-31"></div><div class="actions"><button type="button" class="danger hidden" id="deleteTask">삭제</button><button type="button" class="quiet" id="cancel">취소</button><button class="primary" type="submit">저장하기</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="./app.js"></script></body></html>
